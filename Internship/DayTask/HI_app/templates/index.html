
<!DOCTYPE html>
<html>
<head>
    <title>Health Insurance Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center text-primary">
            Health Insurance Prediction
        </h2>

        <form action="/predict" method="post">

            <label class="form-label">Age</label>
            <input type="number" name="age"
                   class="form-control mb-3"
                   min="18" max="100" required>

            <label class="form-label">Gender</label>
            <select name="sex" class="form-select mb-3" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label class="form-label">BMI</label>
            <input type="number" name="bmi"
                   step="0.01"
                   class="form-control mb-3" required>

            <label class="form-label">Children</label>
            <input type="number" name="children"
                   min="0"
                   class="form-control mb-3" required>

            <label class="form-label">Smoker</label>
            <select name="smoker" class="form-select mb-3" required>
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>

            <button type="submit"
                    class="btn btn-primary w-100">
                Predict Premium
            </button>

        </form>

        {% if prediction is not none %}
            <div class="alert alert-success mt-4">
                <h4>Predicted Insurance Charges</h4>
                <h3>{{ prediction }}</h3>
            </div>
        {% endif %}

    </div>
</div>

</body>
</html>
